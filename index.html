<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e141c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Ángulo de Maniobra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one screen. Car centred on a dark road; big angle number and a −45…+45 bar at the bottom. Nothing else. */
:root{
  --bg:#0e141c; --road:#151d27; --line:#2a3644; --fg:#eef1f4; --muted:#8a99a8;
  --ok:#5fc7b8; --amber:#f2b33d; --stop:#f0645a; --car:#e8edf2; --glass:#4f6a86;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-num);overflow:hidden;margin:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;min-height:0}
.panel{padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.deg{text-align:center;font-weight:700;font-size:88px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--ok);transition:color .2s}
.deg small{font-size:40px;color:var(--muted)}
.bar{position:relative;height:40px;margin-bottom:14px}
.track{position:absolute;inset:6px 0;background:var(--road);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--ok)}
.tick{position:absolute;top:0;bottom:0;width:2px;transform:translateX(-1px)}
.t25{background:var(--amber)} .t45{background:var(--stop)} .t0{background:var(--muted);opacity:.5}
.lbl{position:absolute;bottom:-16px;transform:translateX(-50%);font-size:14px;color:var(--muted)}
.reset{font:inherit;font-weight:600;font-size:20px;letter-spacing:.06em;color:var(--fg);background:var(--line);border:0;border-radius:10px;padding:14px;cursor:pointer}
.reset:active{background:var(--muted);color:var(--bg)}
.reset:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  background:color-mix(in srgb,var(--bg) 82%,transparent);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));cursor:pointer}
.overlay b{font-size:34px;letter-spacing:.04em}
.overlay span{font-family:system-ui,sans-serif;font-size:15px;color:var(--muted);max-width:30ch;line-height:1.4}
.install{font:inherit;font-weight:600;font-size:20px;letter-spacing:.04em;color:#06201c;background:var(--ok);border:0;border-radius:10px;padding:14px 22px;margin-top:10px;cursor:pointer}
.install:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.status{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);background:var(--road);border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.status.park{color:var(--ok);border-color:var(--ok)} .status.stop{color:var(--amber);border-color:var(--amber)}
.app.idle .panel,.app.idle canvas{opacity:.35;transition:opacity .4s}
.msg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:system-ui,sans-serif;font-size:14px;
  color:var(--fg);background:var(--line);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90vw;text-align:center}
.msg.on{opacity:1}
@media (prefers-reduced-motion:reduce){.deg,.msg{transition:none}}
</style>

<div class="app" id="app">
  <canvas id="cv" aria-label="Coche visto desde arriba"></canvas>
  <div class="panel">
    <div class="deg" id="deg">0<small>°</small></div>
    <div class="bar" aria-hidden="true">
      <div class="track">
        <div class="fill" id="fill"></div>
        <div class="tick t45" style="left:0%"></div><div class="tick t25" style="left:22.2%"></div>
        <div class="tick t0" style="left:50%"></div>
        <div class="tick t25" style="left:77.8%"></div><div class="tick t45" style="left:100%"></div>
      </div>
      <span class="lbl" style="left:3%">45</span><span class="lbl" style="left:22.2%">25</span><span class="lbl" style="left:50%">0</span>
      <span class="lbl" style="left:77.8%">25</span><span class="lbl" style="left:97%">45</span>
    </div>
    <button type="button" class="reset" id="reset">Poner a 0°</button>
  </div>
</div>
<div class="overlay" id="ov"><b>Toca para empezar</b><span id="ovTxt">Con el coche recto y el teléfono ya colocado. Si marca algún grado estando recto, toca «Poner a 0°».</span><button type="button" class="install" id="install" hidden>Instalar como app</button></div>
<div class="status" id="status" hidden></div>
<div class="msg" id="msg"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let angle=0, shown=0, started=false, source=null;
const armed={25:true,45:true};
let audio=null;

function toast(t,ms=2200){const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove('on'),ms)}

/* ---------- sound ---------- */
function tone(f,t0,dur,vol){
  const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(audio.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function chime(l){ if(!audio)return; if(audio.state==='suspended')audio.resume(); const t=audio.currentTime+0.02;
  if(l===25){tone(784,t,0.45,0.35);tone(1046.5,t+0.15,0.6,0.3)} else {tone(1046.5,t,0.3,0.4);tone(1318.5,t+0.12,0.3,0.35);tone(1568,t+0.24,0.7,0.35)} }
function alertAt(l){ chime(l); if(navigator.vibrate)navigator.vibrate(l===25?120:[120,80,120]) }
function checkAlerts(a){ if(mode==='drive')return; const v=Math.abs(a); [25,45].forEach(l=>{ if(armed[l]&&v>=l){armed[l]=false;alertAt(l)} else if(!armed[l]&&v<l-3)armed[l]=true }) }

/* ---------- sensors ---------- */
// A) deviceorientation: fused, drift-free. Heading of a horizontal phone axis, whatever the mount.
let refYaw=null,lastYaw=null,unwrapped=0,axis=null;
function yawFromEuler(a,b,g){
  const d=Math.PI/180,cA=Math.cos(a*d),sA=Math.sin(a*d),cB=Math.cos(b*d),sB=Math.sin(b*d),cG=Math.cos(g*d),sG=Math.sin(g*d);
  const Y=[-cB*sA, cA*cB, sB];                       // phone's long axis in world coords
  const Z=[cG*sA*sB+cA*sG, sA*sG-cA*cG*sB, cB*cG];   // axis out of the screen
  if(!axis) axis=Math.abs(Y[2])<Math.abs(Z[2])?'Y':'Z'; // pick the more horizontal one once
  const v=axis==='Y'?Y:Z;
  if(Math.hypot(v[0],v[1])<0.2) return null;
  return Math.atan2(v[1],v[0])/d;                    // counter-clockwise from east
}
function onOrient(e){
  if(e.alpha==null)return;
  const y=yawFromEuler(e.alpha,e.beta||0,e.gamma||0); if(y==null)return;
  if(source!=='orient'){ if(source==='gyro')return; source='orient' }
  if(lastYaw!=null){let d=y-lastYaw; if(d>180)d-=360; if(d<-180)d+=360; unwrapped+=d}
  lastYaw=y;
  if(refYaw==null)refYaw=unwrapped;
  setAngle(-(unwrapped-refYaw));                     // clockwise (right) = positive
}
// B) devicemotion gyro, integrated around gravity. Used only if A never arrives.
let gx=0,gy=0,gz=9.8,lastT=0,gyroAngle=0;
function onMotion(e){
  onAccel(e);
  const r=e.rotationRate,a=e.accelerationIncludingGravity;
  if(!r||r.alpha==null)return;
  if(source==='orient')return;
  if(!source){ if(performance.now()-startT<700)return; source='gyro' } // give orientation a head start
  const now=performance.now(),dt=lastT?Math.min((now-lastT)/1000,0.1):0;lastT=now;
  if(a&&a.x!=null){gx+=(a.x-gx)*.08;gy+=(a.y-gy)*.08;gz+=(a.z-gz)*.08}
  const n=Math.hypot(gx,gy,gz)||1; let w=(r.beta*gx+r.gamma*gy+r.alpha*gz)/n;
  if(Math.abs(w)<0.4)w=0;
  gyroAngle-=w*dt; setAngle(gyroAngle);
}
function setAngle(a){angle=a;checkAlerts(a)}
// Reset: forget the phone's current tilt and take the present position as straight.
function zero(quiet){axis=null;lastYaw=null;refYaw=null;unwrapped=0;gyroAngle=0;angle=0;shown=0;armed[25]=armed[45]=true;if(!quiet)toast('Ángulo a 0°')}

/* ---------- parking detection ---------- */
// drive: moving faster than KMH_DRIVE, silent. stop: stopped >2 s, angle held at 0. park: moving again after a stop, alerts on.
// always: no GPS permission, behaves like before (always active).
const KMH_DRIVE=12, STOP_MS=2000, DRIVE_MS=3000;
let mode='always', speed=null, lastFix=0, prevFix=null, stopSince=0, fastSince=0, accVar=0;
function onAccel(e){
  const a=e.acceleration; let m;
  if(a&&a.x!=null) m=Math.hypot(a.x,a.y,a.z);
  else { const g=e.accelerationIncludingGravity; if(!g||g.x==null)return; m=Math.abs(Math.hypot(g.x,g.y,g.z)-9.81) }
  accVar+=(m*m-accVar)*0.05;
}
function onFix(p){
  const now=Date.now(); let s=p.coords.speed;
  if((s==null||isNaN(s))&&prevFix){ const d=distM(prevFix.coords,p.coords), dt=(p.timestamp-prevFix.timestamp)/1000; if(dt>0)s=d/dt }
  prevFix=p; lastFix=now; if(s!=null&&!isNaN(s))speed=s*3.6;
}
function distM(a,b){const R=6371000,d=Math.PI/180,dl=(b.latitude-a.latitude)*d,dn=(b.longitude-a.longitude)*d;
  const h=Math.sin(dl/2)**2+Math.cos(a.latitude*d)*Math.cos(b.latitude*d)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function setMode(m){ if(mode===m)return; mode=m; $('app').classList.toggle('idle',m==='drive');
  if(m==='park')armed[25]=armed[45]=true; }
function tick(){
  if(mode!=='always'){
    const now=Date.now(), gpsOk=now-lastFix<5000&&speed!=null, quiet=Math.sqrt(accVar)<0.25;
    const stopped=gpsOk?speed<2:quiet;      // no GPS (garage): use the accelerometer
    stopSince=stopped?(stopSince||now):0;
    fastSince=(gpsOk&&speed>KMH_DRIVE)?(fastSince||now):0;
    // Zero only once: when the car stops after driving. Stops during the manoeuvre keep the angle.
    if(mode==='drive'&&stopSince&&now-stopSince>STOP_MS){ setMode('stop'); zero(true) }
    else if(mode==='stop'&&(Math.abs(angle)>3||(gpsOk&&speed>2.5))) setMode('park');
    if(fastSince&&now-fastSince>DRIVE_MS) setMode('drive');
  }
  const st=$('status'), kmh=speed==null||Date.now()-lastFix>5000?'sin GPS':Math.round(speed)+' km/h';
  st.className='status '+mode;
  st.textContent=mode==='always'?'Siempre activo':mode==='drive'?'En marcha · '+kmh:mode==='stop'?'Listo para aparcar':'Aparcando · '+kmh;
}
setInterval(tick,250);

let startT=0;
async function start(){
  try{audio=new (window.AudioContext||window.webkitAudioContext)();tone(440,audio.currentTime,0.01,0.0002)}catch(e){}
  let denied=false;
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted')denied=true }
    if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){
      try{await DeviceMotionEvent.requestPermission()}catch(e){} }
  }catch(e){denied=true}
  startT=performance.now();
  window.addEventListener('deviceorientation',onOrient);
  window.addEventListener('devicemotion',onMotion);
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}
  if(navigator.geolocation){ mode='stop';
    navigator.geolocation.watchPosition(onFix,err=>{ if(err.code===1){ mode='always'; $('app').classList.remove('idle'); toast('Sin permiso de ubicación: siempre activo',3500) } },
      {enableHighAccuracy:true,maximumAge:0,timeout:15000}) }
  started=true; $('ov').hidden=true; $('status').hidden=false;
  setTimeout(()=>{
    if(source){zero(true);return toast('Listo · 0°')}   // sensors settle in the first second, so zero again
    $('ov').hidden=false; started=false;
    $('ov').firstChild.textContent='Sin sensores';
    $('ovTxt').textContent=!window.isSecureContext?'Chrome bloquea los sensores en archivos abiertos desde el teléfono. Abre la app desde una dirección https.'
      :denied?'Has denegado el acceso al movimiento. Recarga la página y acepta el permiso.'
      :'Este navegador no envía datos del giroscopio. Prueba con Chrome (Android) o Safari (iPhone).';
  },1500);
}
$('ov').addEventListener('click',()=>{ if(!started)start() });
// Install prompt (Chrome): shown only when the browser says the app can be installed
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').addEventListener('click',async e=>{e.stopPropagation(); if(!deferred)return; deferred.prompt();
  try{const r=await deferred.userChoice; if(r.outcome==='accepted')$('install').hidden=true}catch(_){} deferred=null});
window.addEventListener('appinstalled',()=>{$('install').hidden=true;toast('App instalada')});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
$('reset').addEventListener('click',()=>{ if(audio&&audio.state==='suspended')audio.resume(); if(started){ zero(); if(mode==='drive')setMode('park') } else start() });
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&started){
  try{audio&&audio.resume()}catch(e){} try{await navigator.wakeLock.request('screen')}catch(e){} }});

/* ---------- drawing ---------- */
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(resize).observe(cv);resize();
const C={};['--road','--line','--car','--glass','--ok','--amber','--stop','--muted'].forEach(k=>C[k]=getComputedStyle(document.documentElement).getPropertyValue(k).trim());
const colorFor=a=>(a=Math.abs(a))>=45?C['--stop']:a>=25?C['--amber']:C['--ok'];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function draw(){
  const target=mode==='drive'?0:angle;
  shown+=(target-shown)*0.35;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C['--road'];ctx.fillRect(0,0,W,H);
  const s=Math.min(H/7,W/4), cx=W/2, cy=H/2, col=colorFor(shown);
  // reference line (where the car pointed at 0°) and 25°/45° guides
  ctx.lineWidth=2;ctx.setLineDash([10,10]);
  [[0,C['--muted']],[25,C['--amber']],[-25,C['--amber']],[45,C['--stop']],[-45,C['--stop']]].forEach(([a,c])=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a*Math.PI/180);ctx.strokeStyle=c;ctx.globalAlpha=a?0.35:0.6;
    ctx.beginPath();ctx.moveTo(0,-H);ctx.lineTo(0,H);ctx.stroke();ctx.restore()});
  ctx.setLineDash([]);ctx.globalAlpha=1;
  // car
  const L=4.4*s/2.2, Wd=1.8*s/2.2, ww=0.24*L/4.4*2.2, wl=0.7*L/4.4*2.2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(shown*Math.PI/180);
  ctx.fillStyle='#05080c';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{rr(sx*(Wd/2-ww*0.3)-ww/2, sy*(L/2-L*0.22)-wl/2, ww, wl, 3);ctx.fill()});
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  ctx.fillStyle=C['--car'];rr(-Wd/2,-L/2,Wd,L,Wd*0.25);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle=C['--glass'];
  ctx.beginPath();ctx.moveTo(-Wd*.40,-L*.16);ctx.lineTo(Wd*.40,-L*.16);ctx.lineTo(Wd*.33,-L*.27);ctx.lineTo(-Wd*.33,-L*.27);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-Wd*.38,L*.24);ctx.lineTo(Wd*.38,L*.24);ctx.lineTo(Wd*.33,L*.33);ctx.lineTo(-Wd*.33,L*.33);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff3c4';rr(-Wd*.42,-L/2+2,Wd*.22,L*.025,2);ctx.fill();rr(Wd*.2,-L/2+2,Wd*.22,L*.025,2);ctx.fill();
  ctx.fillStyle='#d8443a';rr(-Wd*.42,L/2-L*.025-2,Wd*.22,L*.025,2);ctx.fill();rr(Wd*.2,L/2-L*.025-2,Wd*.22,L*.025,2);ctx.fill();
  ctx.fillStyle=col;rr(-Wd*.08,-L*.08,Wd*.16,L*.22,3);ctx.fill();
  ctx.restore();
  // readout
  const v=mode==='drive'?'–':Math.round(Math.abs(angle)), d=$('deg');
  if(d.dataset.v!=v){d.dataset.v=v;d.innerHTML=v+'<small>°</small>'}
  d.style.color=colorFor(target);
  const a=Math.max(-45,Math.min(45,shown)),p=Math.abs(a)/45*50,f=$('fill');
  f.style.width=p+'%';f.style.left=(a<0?50-p:50)+'%';f.style.background=col;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body></html>
