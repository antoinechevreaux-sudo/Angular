<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Ángulo de Maniobra</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e141c">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0e141c; --road:#151d27; --line:#2a3644; --fg:#eef1f4; --muted:#8a99a8;
  --ok:#5fc7b8; --amber:#f2b33d; --stop:#f0645a; --car:#e8edf2; --glass:#4f6a86;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-num);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;min-height:0}
.panel{padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.deg{text-align:center;font-weight:700;font-size:88px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--ok);transition:color .2s}
.deg small{font-size:40px;color:var(--muted)}
.bar{position:relative;height:40px;margin-bottom:14px}
.track{position:absolute;inset:6px 0;background:var(--road);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--ok)}
.tick{position:absolute;top:0;bottom:0;width:2px;transform:translateX(-1px)}
.t25{background:var(--amber)} .t45{background:var(--stop)} .t0{background:var(--muted);opacity:.5}
.lbl{position:absolute;bottom:-16px;transform:translateX(-50%);font-size:14px;color:var(--muted)}
.reset{font:inherit;font-weight:600;font-size:20px;letter-spacing:.06em;color:var(--fg);background:var(--line);border:0;border-radius:10px;padding:14px;cursor:pointer}
.reset:active{background:var(--muted);color:var(--bg)}
.reset:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app.idle canvas,.app.idle .deg,.app.idle .bar{opacity:.35;transition:opacity .4s}
.status{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;
  font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;font-variant-numeric:tabular-nums;
  color:var(--muted);background:var(--road);border:1px solid var(--line);padding:5px 10px;border-radius:6px}
.status.on{color:var(--ok);border-color:var(--ok)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .1s}
.dot.hear{background:var(--amber)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  background:color-mix(in srgb,var(--bg) 82%,transparent);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));cursor:pointer}
.overlay b{font-size:34px;letter-spacing:.04em}
.overlay span{font-family:system-ui,sans-serif;font-size:15px;color:var(--muted);max-width:30ch;line-height:1.4}
.install{font:inherit;font-weight:600;font-size:20px;letter-spacing:.04em;color:#06201c;background:var(--ok);border:0;border-radius:10px;padding:14px 22px;margin-top:10px;cursor:pointer}
.msg{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:system-ui,sans-serif;font-size:14px;
  color:var(--fg);background:var(--line);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90vw;text-align:center}
.msg.on{opacity:1}
@media (prefers-reduced-motion:reduce){.deg,.msg{transition:none}}
</style></head><body>

<div class="app idle" id="app">
  <canvas id="cv" aria-label="Coche visto desde arriba"></canvas>
  <div class="panel">
    <div class="deg" id="deg">–<small>°</small></div>
    <div class="bar" aria-hidden="true">
      <div class="track">
        <div class="fill" id="fill"></div>
        <div class="tick t45" style="left:0%"></div><div class="tick t25" style="left:22.2%"></div>
        <div class="tick t0" style="left:50%"></div>
        <div class="tick t25" style="left:77.8%"></div><div class="tick t45" style="left:100%"></div>
      </div>
      <span class="lbl" style="left:3%">45</span><span class="lbl" style="left:22.2%">25</span><span class="lbl" style="left:50%">0</span>
      <span class="lbl" style="left:77.8%">25</span><span class="lbl" style="left:97%">45</span>
    </div>
    <button type="button" class="reset" id="reset">Poner a 0°</button>
  </div>
</div>
<div class="overlay" id="ov"><b>Toca para empezar</b><span id="ovTxt">Coloca el teléfono en el soporte. Cuando vayas a aparcar, silba un trozo de una canción: la app se pone a 0° y mide durante un minuto.</span><button type="button" class="install" id="install" hidden>Instalar como app</button></div>
<div class="status" id="status" hidden><i class="dot" id="dot"></i><span id="stTxt">Silba para empezar</span></div>
<div class="msg" id="msg"></div>

<script>
/* Detector de silbido: busca un tono casi puro (sin armónicos) entre 600 y 3500 Hz que dure ~1 s
   y cambie de nota (una melodía). El motor, la voz y casi toda la música tienen armónicos o no son tonos. */
function WhistleDetector(ctx,stream,o){
  const P=Object.assign({lo:600,hi:3500,ratio:17,harm:11,sub:6,minDb:-80,winMs:1500,need:0.5,spread:1.10,run:900},o||{});
  const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();
  an.fftSize=4096;an.smoothingTimeConstant=0.15;src.connect(an);
  const N=an.frequencyBinCount,db=new Float32Array(N),hz=ctx.sampleRate/an.fftSize;
  const lo=Math.round(P.lo/hz),hi=Math.round(P.hi/hz),hist=[];
  let paused=false,timer=0;
  const api={onWhistle(){},onFrame(){},pause(v){if(paused!==v){paused=v;hist.length=0}},stop(){clearInterval(timer);stream.getTracks().forEach(t=>t.stop())},P};
  const lin=d=>Math.pow(10,d/10),maxAround=(c,w)=>{let m=-Infinity;for(let i=Math.max(1,c-w);i<=Math.min(N-1,c+w);i++)if(db[i]>m)m=db[i];return m};
  function frame(){
    an.getFloatFrequencyData(db);
    let p=lo;for(let i=lo;i<=hi;i++)if(db[i]>db[p])p=i;
    let s=0,n=0;for(let i=lo;i<=hi;i++)if(Math.abs(i-p)>5){s+=lin(db[i]);n++}
    const ratio=db[p]-10*Math.log10(s/n+1e-30);
    const h2=2*p<N-3?db[p]-maxAround(2*p,3):99;          // armónico al doble: un silbido casi no tiene
    const sub=db[p]-maxAround(Math.round(p/2),3);          // nota más grave: la voz tiene su fundamental abajo
    const sub3=db[p]-maxAround(Math.round(p/3),3);
    const a=db[p-1],b=db[p],c=db[p+1],off=(a-c)/(2*(a-2*b+c)||1),f=(p+(isFinite(off)?off:0))*hz;
    const ok=db[p]>P.minDb&&ratio>=P.ratio&&h2>=P.harm&&sub>=P.sub&&sub3>=P.sub;
    const t=performance.now();
    hist.push({t,ok,f});while(hist.length&&hist[0].t<t-P.winMs)hist.shift();
    api.onFrame(ok,{f,ratio,h2,sub,db:db[p]});
    if(paused)return;
    const span=hist.length?t-hist[0].t:0,good=hist.filter(x=>x.ok);
    if(span<P.winMs*0.9||good.length<hist.length*P.need)return;
    // continuo: un tramo de al menos P.run ms sin cortes (se perdonan dos fotogramas sueltos); un «ding» se apaga antes
    let best=0,st=null,miss=0;for(const x of hist){if(x.ok){if(st==null)st=x.t;miss=0;best=Math.max(best,x.t-st)}else if(st!=null&&++miss>2){st=null;miss=0}}
    if(best<P.run)return;
    // tiene que cambiar de nota: una alarma o un pitido del coche se quedan en la misma
    const fs=good.map(x=>x.f).sort((x,y)=>x-y),lo10=fs[Math.floor(fs.length*.1)],hi90=fs[Math.floor(fs.length*.9)];
    if(hi90/lo10<P.spread)return;
    hist.length=0;api.onWhistle(t);
  }
  timer=setInterval(frame,40);
  return api;
}
</script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const LV1=25,LV2=45,HYST=3,ACTIVE_MS=60000;
let angle=0,shown=0,started=false,source=null,active=false,until=0,quietUntil=0,det=null;
const armed={25:true,45:true};
let audio=null;
const toast=(t,ms=2200)=>{const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove('on'),ms)};
window.__ang={get active(){return active},get angle(){return angle},triggers:[]};

/* ---------- sonido ---------- */
function tone(f,t0,dur,vol){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(audio.destination);o.start(t0);o.stop(t0+dur+0.05)}
function chime(l){if(!audio)return;if(audio.state==='suspended')audio.resume();const t=audio.currentTime+0.02;
  if(l===LV1){tone(784,t,0.45,0.35);tone(1046.5,t+0.15,0.6,0.3)}else{tone(1046.5,t,0.3,0.4);tone(1318.5,t+0.12,0.3,0.35);tone(1568,t+0.24,0.7,0.35)}}
function tick(){if(!audio)return;const t=audio.currentTime+0.02;tone(330,t,0.12,0.12)}   // aviso discreto de «empiezo a medir»
function alertAt(l){chime(l);if(navigator.vibrate)navigator.vibrate(l===LV1?120:[120,80,120])}
function checkAlerts(a){if(!active)return;const v=Math.abs(a);
  [LV1,LV2].forEach(l=>{if(armed[l]&&v>=l){armed[l]=false;alertAt(l)}else if(!armed[l]&&v<l-HYST)armed[l]=true})}

/* ---------- medir / parar ---------- */
function activate(why){zero();active=true;until=performance.now()+ACTIVE_MS;if(det)det.pause(true);
  $('app').classList.remove('idle');if(navigator.vibrate)navigator.vibrate(60);tick();window.__ang.triggers.push({t:performance.now(),why})}
function deactivate(){active=false;$('app').classList.add('idle');quietUntil=performance.now()+1500}
setInterval(()=>{if(!started||window.AndroidApp&&AndroidApp.estado)return;const t=performance.now();
  if(active&&t>until)deactivate();
  if(!active&&det&&t>quietUntil)det.pause(false);
  const st=$('status');st.classList.toggle('on',active);
  $('stTxt').textContent=active?'Midiendo · '+Math.ceil((until-t)/1000)+' s':det?'Silba para empezar':'Sin micrófono · usa el botón'},200);

/* ---------- giro del coche (orientación del teléfono) ---------- */
let refYaw=null,lastYaw=null,unwrapped=0,axis=null;
function yawFromEuler(a,b,g){
  const d=Math.PI/180,cA=Math.cos(a*d),sA=Math.sin(a*d),cB=Math.cos(b*d),sB=Math.sin(b*d),cG=Math.cos(g*d),sG=Math.sin(g*d);
  const Y=[-cB*sA,cA*cB,sB],Z=[cG*sA*sB+cA*sG,sA*sG-cA*cG*sB,cB*cG];
  if(!axis)axis=Math.abs(Y[2])<Math.abs(Z[2])?'Y':'Z';
  const v=axis==='Y'?Y:Z;if(Math.hypot(v[0],v[1])<0.2)return null;
  return Math.atan2(v[1],v[0])/d;
}
function onOrient(e){if(e.alpha==null)return;const y=yawFromEuler(e.alpha,e.beta||0,e.gamma||0);if(y==null)return;
  if(source!=='orient'){if(source==='gyro')return;source='orient'}
  if(lastYaw!=null){let d=y-lastYaw;if(d>180)d-=360;if(d<-180)d+=360;unwrapped+=d}
  lastYaw=y;if(refYaw==null)refYaw=unwrapped;setAngle(-(unwrapped-refYaw))}
let gx=0,gy=0,gz=9.8,lastT=0,gyroAngle=0,startT=0;
function onMotion(e){const r=e.rotationRate,a=e.accelerationIncludingGravity;if(!r||r.alpha==null||source==='orient')return;
  if(!source){if(performance.now()-startT<700)return;source='gyro'}
  const now=performance.now(),dt=lastT?Math.min((now-lastT)/1000,0.1):0;lastT=now;
  if(a&&a.x!=null){gx+=(a.x-gx)*.08;gy+=(a.y-gy)*.08;gz+=(a.z-gz)*.08}
  const n=Math.hypot(gx,gy,gz)||1;let w=(r.beta*gx+r.gamma*gy+r.alpha*gz)/n;if(Math.abs(w)<0.4)w=0;gyroAngle-=w*dt;setAngle(gyroAngle)}
function setAngle(a){angle=a;checkAlerts(a)}
function zero(){axis=null;lastYaw=null;refYaw=null;unwrapped=0;gyroAngle=0;angle=0;shown=0;armed[25]=armed[45]=true}

/* ---------- arranque ---------- */
async function start(){
  try{audio=new (window.AudioContext||window.webkitAudioContext)();tone(440,audio.currentTime,0.01,0.0002)}catch(e){}
  let denied=false;
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted')denied=true}
    if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
  }catch(e){denied=true}
  startT=performance.now();
  window.addEventListener('deviceorientation',onOrient);window.addEventListener('devicemotion',onMotion);
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}
  started=true;$('ov').hidden=true;$('status').hidden=false;
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    det=WhistleDetector(audio,st);
    det.onWhistle=()=>{if(!active)activate('silbido')};
    let hearT=0;det.onFrame=ok=>{if(ok)hearT=performance.now();$('dot').classList.toggle('hear',performance.now()-hearT<250)};
  }catch(e){toast('Sin micrófono: usa el botón «Poner a 0°»',4000)}
  setTimeout(()=>{
    if(source)return;
    $('ov').hidden=false;started=false;$('ov').firstChild.textContent='Sin sensores';
    $('ovTxt').textContent=!window.isSecureContext?'Chrome bloquea los sensores en archivos abiertos desde el teléfono. Abre la app desde una dirección https.'
      :denied?'Has denegado el acceso al movimiento. Recarga la página y acepta el permiso.'
      :'Este teléfono no envía datos del giroscopio.';
  },1500);
}
/* ---------- dentro del APK: lo hace todo el servicio de Android (sigue con Waze delante o la pantalla apagada) ---------- */
const NATIVE=!!(window.AndroidApp&&AndroidApp.estado);
let nat={};
function natStart(){AndroidApp.iniciar();started=true;$('ov').hidden=true;$('status').hidden=false}
if(NATIVE){
  $('ovTxt').textContent='Coloca el teléfono en el soporte y toca aquí. Funciona aunque uses Waze o apagues la pantalla: silba un trozo de una canción y medirá durante un minuto.';
  try{nat=JSON.parse(AndroidApp.estado())}catch(e){}
  if(nat.running)natStart();
  setInterval(()=>{if(!started)return;try{nat=JSON.parse(AndroidApp.estado())}catch(e){return}
    if(nat.active&&!active)$('app').classList.remove('idle');if(!nat.active&&active)$('app').classList.add('idle');
    active=nat.active;angle=nat.angle;
    $('status').classList.toggle('on',active);$('dot').classList.toggle('hear',!!nat.hear);
    $('stTxt').textContent=!nat.running?'Iniciando…':active?'Midiendo · '+nat.left+' s':nat.mic?'Silba para empezar':'Sin micrófono · usa el botón'},100);
}
$('ov').addEventListener('click',()=>{if(!started)NATIVE?natStart():start()});
$('reset').addEventListener('click',()=>{
  if(NATIVE){if(started){AndroidApp.reset();toast('0° · midiendo un minuto')}else natStart();return}
  if(audio&&audio.state==='suspended')audio.resume();if(started){activate('botón');toast('0° · midiendo un minuto')}else start()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&started){
  try{audio&&audio.resume()}catch(e){}try{await navigator.wakeLock.request('screen')}catch(e){}}});

/* ---------- instalar ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').addEventListener('click',async e=>{e.stopPropagation();if(!deferred)return;deferred.prompt();
  try{const r=await deferred.userChoice;if(r.outcome==='accepted')$('install').hidden=true}catch(_){}deferred=null});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

/* ---------- dibujo ---------- */
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(resize).observe(cv);resize();
const C={};['--road','--line','--car','--glass','--ok','--amber','--stop','--muted'].forEach(k=>C[k]=getComputedStyle(document.documentElement).getPropertyValue(k).trim());
const colorFor=a=>(a=Math.abs(a))>=LV2?C['--stop']:a>=LV1?C['--amber']:C['--ok'];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
  const target=active?angle:0;shown+=(target-shown)*0.35;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C['--road'];ctx.fillRect(0,0,W,H);
  const s=Math.min(H/7,W/4),cx=W/2,cy=H/2,col=colorFor(shown);
  ctx.lineWidth=2;ctx.setLineDash([10,10]);
  [[0,C['--muted']],[LV1,C['--amber']],[-LV1,C['--amber']],[LV2,C['--stop']],[-LV2,C['--stop']]].forEach(([a,c])=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a*Math.PI/180);ctx.strokeStyle=c;ctx.globalAlpha=a?0.35:0.6;
    ctx.beginPath();ctx.moveTo(0,-H);ctx.lineTo(0,H);ctx.stroke();ctx.restore()});
  ctx.setLineDash([]);ctx.globalAlpha=1;
  const L=4.4*s/2.2,Wd=1.8*s/2.2,ww=0.24*L/4.4*2.2,wl=0.7*L/4.4*2.2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(shown*Math.PI/180);
  ctx.fillStyle='#05080c';[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{rr(sx*(Wd/2-ww*0.3)-ww/2,sy*(L/2-L*0.22)-wl/2,ww,wl,3);ctx.fill()});
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  ctx.fillStyle=C['--car'];rr(-Wd/2,-L/2,Wd,L,Wd*0.25);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle=C['--glass'];
  ctx.beginPath();ctx.moveTo(-Wd*.40,-L*.16);ctx.lineTo(Wd*.40,-L*.16);ctx.lineTo(Wd*.33,-L*.27);ctx.lineTo(-Wd*.33,-L*.27);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-Wd*.38,L*.24);ctx.lineTo(Wd*.38,L*.24);ctx.lineTo(Wd*.33,L*.33);ctx.lineTo(-Wd*.33,L*.33);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff3c4';rr(-Wd*.42,-L/2+2,Wd*.22,L*.025,2);ctx.fill();rr(Wd*.2,-L/2+2,Wd*.22,L*.025,2);ctx.fill();
  ctx.fillStyle='#d8443a';rr(-Wd*.42,L/2-L*.025-2,Wd*.22,L*.025,2);ctx.fill();rr(Wd*.2,L/2-L*.025-2,Wd*.22,L*.025,2);ctx.fill();
  ctx.fillStyle=col;rr(-Wd*.08,-L*.08,Wd*.16,L*.22,3);ctx.fill();ctx.restore();
  const v=active?Math.round(Math.abs(angle)):'–',d=$('deg');
  if(d.dataset.v!=v){d.dataset.v=v;d.innerHTML=v+'<small>°</small>'}
  d.style.color=colorFor(target);
  const a=Math.max(-45,Math.min(45,shown)),p=Math.abs(a)/45*50,f=$('fill');
  f.style.width=p+'%';f.style.left=(a<0?50-p:50)+'%';f.style.background=col;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body></html>
